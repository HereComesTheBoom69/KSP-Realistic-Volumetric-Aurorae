// Realistic Volumetric Aurorae (RVA) settings
// Lives in PluginData so KSP/ModuleManager never touch it.
// DEV FILE: every setting, for the Dev build of the plugin (AURORA_DEV).
// The release build ignores the dev-only keys in here (they keep their
// built-in values, which are these same numbers) and never writes them.
// The values are the tuned baseline and the plugin's built-in defaults: a key
// you delete falls back to the same value, and each row's "def" button in the
// window restores it.
// Edit live in flight: hold KSP's modifier key (Alt) and press F8.
// "Save to settings.cfg" in that window rewrites this file.
//
// Fractions are of planet radius.

RVA_SETTINGS
{
    // ---- geometry ----
    altBaseFraction = 0.0497       // lift: bottom of the band above the surface (0.0497 x 600 km = 30 km)
    altTopFraction = 0.08          // band height (thickness): 0.08 x 600 km = 48 km
    stormHeightGain = 1.2478   // top rises 25% at peak storm

    // ---- look ----
    brightness = 11.2596       // HDR multiplier before the tonemap (default 8)
    exposure = 0.6822          // tonemap exposure (default 1); brightness x exposure is what counts
    // vertical colour layout, 0 = band bottom .. 1 = band top:
    // pure green up to greenTop, fades to blue by blueBottom, pure blue until blueTop,
    // fades to pink by pinkBottom, pure pink above (transitions are never narrower than +-6 %)
    greenTop = 0.504
    blueBottom = 0.5
    blueTop = 0.5
    pinkBottom = 1
    gainLow = 3                // green brightness
    gainMid = 0                    // blue brightness (0 = no blue zone)
    gainHigh = 3               // pink brightness
    highAltBoost = 3               // extra density toward the top
    compressFactor = 0.7875    // upper-band squeeze
    rayThreshold = 0.4268      // higher = sparser rays
    rayGain = 4.3836           // higher = crisper rays
    rayTaper = 1               // columns widest at the base, narrowing to tips at the top (0 = the v3.13 look: uniform width, reading as icicles under the density boost)
    rayZone = 1                    // where the rays live: +1 = rays above a smooth lower glow (original), 0 = rays from the bottom edge up, -1 = rays at the bottom under a smooth diffuse top
    rayScale = 6                   // ray fineness: 1 = the original 60 km rays, 6 = very thin columns
    edgeSharpness = 0.0524     // ribbon edge: 0 = soft falloff, 1 = hard rim
    topSpread = 3              // ribbon widens toward its top (diffuse red cap)
    bottomSoftness = 0.02          // bottom edge fade-in (0..1 of band height); 0.02 = crispest lower border
    detailStrength = 1         // fine structure that fades in when close
    daylightFade = 0.901           // 1 = invisible on the sunlit side (fades out past the terminator), 0 = always visible
    latCenter = 0.65               // 0.65 x 90 = 58.5 deg
    latWidth = 0.0061          // ribbon half-width: 0.0061 = +-0.55 deg = +-5.7 km (a thin sheet; its apparent width from orbit comes from the folds)
    foldStrength = 0.3             // ribbon folds/curls amplitude (0 = plain meander, 0.3 = wild)
    foldScale = 4              // fold size: higher = tighter curls (4 = the tightest)
    bandSpacing = 1.1746       // latitude spacing of the three arcs: 0 = all on one line, 1 = +-4.5 deg, 2 = twice that
    bandIndependence = 0       // 0 = the arcs fold identically (nested parallel lines), 1 = each folds on its own and they cross / merge
    widthVariance = 3              // band thickness varies along the band: width x (1 +- this), floored at 0.15x; up to 3 (v3.23b): the thick stretches grow to 1+V x, more of the band sits at the floor
    heightVariance = 0.6042    // 1 = local top wanders between 30 and 100 % of the height (original look), 0 = flat top
    spikiness = 0                  // thin columns stretching the top upward; 1 = up to 2.2x the local top
    spikeThreshold = 0.6           // higher = fewer, sparser spikes
    greenSpikes = 1            // regions where the rays stay green up into the blue/pink heights
    noiseScale = 2.5
    colorLow = 0.4,1,0.192,1       // green  (bottom)
    colorMid = 0.4,0.2,0.9,1       // blue   (middle)
    colorHigh = 1,0.213,0.244,1    // red    (top)

    // ---- storm cycle ----
    // the oval through a storm (storm intensity 0 = quiet .. 1 = peak; preview with the window's manual intensity):
    ovalQuietSpread = 0.35         // arc spacing x this when quiet (1 = the configured spacing all the time; 0.35 = the arcs nearly on one line)
    ovalStormSpread = 1.6          // arc spacing x this at peak storm: the oval widens to lower AND higher latitudes
    ovalEquatorward = 0.04         // the whole oval's centre moves toward the equator by this at peak (0.04 = 3.6 deg)
    ovalStormWiden = 0             // ribbon half-width x (1 + this x intensity): fatter sheets in a storm (0 = unchanged)
    arc2Appears = 0.35             // storm intensity at which the second arc is fully in (fades in over the 0.15 below); 0 = always on
    arc3Appears = 0.6              // same for the third arc
    baseActivity = 0.2503      // quiet-time activity (0 = the calm floor: ray contrast x0.3)
    stormActivity = 0.6985     // peak-storm activity (0 = storms change speed and height only)
    baseAnimSpeed = 0.1549     // quiet aurora drifts slowly
    stormAnimSpeed = 0.2507    // livelier at peak storm
    averageQuietDuration = 90      // mean seconds between storms

    // ---- sampling / performance ----
    stepLength = 0.005             // sample spacing far away, fraction of planet radius (0.005 = 3 km on Kerbin); smaller = finer, slower
    nearStepScale = 0.1243     // the step shrinks to this x stepLength as the band comes within 300 km of the camera (0.1243 = 370 m from under the band, which keeps the 600 m ray octave); 1 = fixed steps everywhere (v3.9 behaviour, cheaper)
    maxSteps = 127.5148            // per-ray cap (cost ceiling)
    jitter = 1                     // per-pixel sample offset; hides sample-plane layering (1 = full step). v3.10: raised from 0.5, since full jitter turns what is left of the sample planes into grain the upsample smooths away
    upsampleSmoothing = 0.7037 // 0 = plain bilinear upsample, 1 = wide smoothing; hides jitter grain and blockiness
    edgeAwareUpsample = true       // the upsample only blends buffer texels whose scene depth agrees with the screen pixel's: vessel, terrain and horizon silhouettes at screen resolution (needs sceneDepthOcclusion)
    renderScale = 0.35             // aurora buffer size vs screen (0.35 = 8x fewer pixels; 0.3 was the baseline up to v3.19, 0.2 in v3.20-3.21. The aurora march is the main GPU cost and scales with this)
    // camera events (codes): 0 AfterForwardAlpha | 1 AfterImageEffects | 2 BeforeImageEffects | 3 BeforeForwardAlpha | 4 AfterEverything | 5 AfterForwardOpaque
    cloudOcclusion = true          // EVE's volumetric clouds occlude the aurora PER PIXEL: the aurora beyond the cloud-top shell is multiplied by their own transmittance (EVE's cloud buffer). Every altitude, no switch
    compositeEvent = 0         // where the aurora is composited (below cloudTopKm if autoAboveClouds): 0 = AfterForwardAlpha, after the transparent pass (plumes, windows and any 2D cloud layers stay in front). With cloudOcclusion it cannot be earlier than 3 (BeforeForwardAlpha, right after EVE's volumetrics); without it, 5 (AfterForwardOpaque) is the only event that puts the aurora under the volumetric clouds
    compositeEventAbove = 2        // where it is composited above cloudTopKm if autoAboveClouds (2 = after the transparent pass, before the image effects)
    autoAboveClouds = false        // switch between the two by camera altitude: only needed without cloudOcclusion, or if something drawn in the transparent pass (2D cloud layers) covers the aurora from orbit
    cloudTopKm = 12                // cloud-top altitude (km): the shell the near / far split uses (and the switch altitude). Set it to the TOP of the highest volumetric layer
    sceneDepthOcclusion = true     // the vessel and terrain within 30 km hide the aurora behind them (camera depth buffer)
    flipY = false                  // only if the aurora shows upside-down
    meanderResolution = 256        // longitude samples in the CPU-baked meander texture
    meanderThreaded = true         // bake the whole meander texture every frame on a worker thread (false: one row per frame on the main thread)

    cloudBufferFormat = 2          // how EVE's cloud buffer stores its alpha: 2 = transmittance (verified for the current volumetrics), 0 = opacity
    cloudBufferFlipY = false       // flip EVE's cloud buffer vertically (only if the occlusion is upside-down)

    // ---- map view / tracking station ----
    mapView = true                 // the aurora around the scaled planet in the map view and the tracking station (second renderer on the scaled-space camera; no cloud occlusion there)
    mapRenderScale = 0.3           // aurora buffer size vs screen for that renderer
    mapCompositeEvent = 0          // camera event on the scaled-space camera: 0 = AfterForwardAlpha, after the scaled clouds and atmosphere


    // ---- misc ----
    toggleKey = F8                 // with the modifier key (Alt) held; any UnityEngine.KeyCode name
    debugMode = 0                  // 0 off | 1 red mesh | 2 blue shell | 6 density probe
    diagnostics = false            // log frame hitches, GC runs, animation-time / material jumps, origin shifts and LUT stalls to KSP.log ([RVA:diag]); also listed in the window
}
