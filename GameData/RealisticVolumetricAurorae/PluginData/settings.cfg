// Realistic Volumetric Aurorae (RVA) — settings
// Lives in PluginData so KSP/ModuleManager never touch it.
// These are the tuned baseline and the plugin's built-in defaults: delete a
// key and it falls back to the same value; each row's "def" button in the
// in-game window restores it. Edit live in flight: hold KSP's modifier key
// (Alt) and press F8; "Save to settings.cfg" in that window rewrites this file.

RVA_SETTINGS
{
    // ---- the band ----
    altBaseFraction = 0.0497       // bottom of the band above the surface, as a fraction of the planet radius (0.0497 x 600 km = 30 km)
    altTopFraction = 0.08          // band height (thickness): 0.08 x 600 km = 48 km
    latCenter = 0.65               // where the oval sits: 0.65 x 90 = 58.5 deg latitude (both hemispheres)
    latWidth = 0.0061              // ribbon half-width: 0.0061 = +-0.55 deg = +-5.7 km (a thin sheet; its apparent width from orbit comes from the folds)
    foldStrength = 0.3             // ribbon folds / curls amplitude (0 = a plain meandering line, 0.3 = wild)
    foldScale = 4                  // fold size: higher = tighter curls (4 = the tightest)

    // ---- look ----
    brightness = 11.2596           // HDR multiplier before the tonemap
    exposure = 0.6822              // tonemap exposure; brightness x exposure is what counts
    rayThreshold = 0.4268          // higher = sparser rays (columns)
    rayScale = 6                   // ray fineness: 1 = broad 60 km rays, 6 = very thin columns
    daylightFade = 0.901           // 1 = invisible on the sunlit side (fades out past the terminator), 0 = always visible
    // colours, bottom to top:
    colorLow = 0.4,1,0.192,1       // green  (bottom)
    colorMid = 0.4,0.2,0.9,1       // blue   (middle)
    colorHigh = 1,0.213,0.244,1    // red    (top)
    gainLow = 3                    // bottom-colour brightness
    gainMid = 0                    // middle-colour brightness (0 = no blue zone)
    gainHigh = 3                   // top-colour brightness
    // vertical colour layout, 0 = band bottom .. 1 = band top:
    // pure bottom colour up to greenTop, fades to the middle colour by blueBottom, pure middle until blueTop,
    // fades to the top colour by pinkBottom, pure top colour above (transitions are never narrower than +-6 %)
    greenTop = 0.504
    blueBottom = 0.5
    blueTop = 0.5
    pinkBottom = 1

    // ---- motion / storms ----
    baseAnimSpeed = 0.1549         // how fast the quiet aurora drifts and flickers
    stormAnimSpeed = 0.2507        // ...and at the peak of a storm (livelier)
    averageQuietDuration = 90      // mean seconds between storms (a storm grows the oval from one arc to three, then fades)

    // ---- performance ----
    renderScale = 0.35             // aurora buffer size vs screen: the GPU cost. 0.35 = 8x fewer pixels than the screen; raise for crisper detail, lower for frames (0.2 is about twice as cheap)

    // ---- misc ----
    mapView = true                 // the aurora around the scaled planet in the map view and the tracking station
    toggleKey = F8                 // opens the tuning window with the modifier key (Alt) held; any UnityEngine.KeyCode name
}
