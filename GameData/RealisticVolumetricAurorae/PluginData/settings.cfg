        edgeSharpness = 0
        rayGain = 5
        compressFactor = 0.7875
        colorLow = 0,1,0.771,1
        colorMid = 1,0.402,1,1
        colorHigh = 1,0.22,0.2,1
        gainLow = 3
        gainMid = 1.2159
        gainHigh = 1.6729
        greenTop = 0.1857
        blueBottom = 0.791
        blueTop = 0
        pinkBottom = 0
        brightness = 11
        exposure = 0.68
        baseActivity = 0.0997
        stormActivity = 0.1994
        averageQuietDuration = 2700
        ovalQuietSpread = 0.45
        ovalStormSpread = 1.6
        arc2Appears = 0
        arc3Appears = 0
        baseAnimSpeed = 0.1251
        stormAnimSpeed = 0.2451
        daylightFade = 0.9
        stormToEquator = true
        stormReach = 0.1318
        stormFoldGain = 4
        ovalStormWiden = 0
        stepLength = 0.0041
        nearStepScale = 0.1243
        stepGrowth = 0.1
        stepFarMul = 1.0815
        stepFilter = 0.75
        cloudTopKm = 16.1815
    }
}
