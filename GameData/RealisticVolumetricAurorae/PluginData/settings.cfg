// Realistic Volumetric Aurorae (RVA) — settings
// Lives in PluginData so KSP/ModuleManager never touch it.
// These are the tuned baseline and the plugin's built-in defaults: delete a
// key and it falls back to the same value; each row's "def" button in the
// in-game window restores it. Edit live in flight: hold KSP's modifier key
// (Alt) and press F8; "Save to settings.cfg" in that window rewrites this file.

RVA_SETTINGS
{
    // ---- the band ----
    altBaseFraction = 0.0334       // bottom of the band above the surface, as a fraction of the planet radius (0.0334 x 600 km = 20 km)
    altTopFraction = 0.08          // band height (thickness): 0.08 x 600 km = 48 km
    latCenter = 0.65               // where the oval sits: 0.65 x 90 = 58.5 deg latitude (both hemispheres)
    latWidth = 0.0061              // ribbon half-width: 0.0061 = +-0.55 deg = +-5.7 km (a thin sheet; its apparent width from orbit comes from the folds)
    foldStrength = 0.3             // ribbon folds / curls amplitude (0 = a plain meandering line, 0.3 = wild)
    foldScale = 4                  // fold size: higher = tighter curls (4 = the tightest)

    // ---- look ----
    brightness = 14.9848           // HDR multiplier before the tonemap
    exposure = 0.6822              // tonemap exposure; brightness x exposure is what counts
    rayThreshold = 0.4268          // higher = sparser rays (columns)
    rayScale = 6                   // ray fineness: 1 = broad 60 km rays, 6 = very thin columns
    daylightFade = 0.901           // 1 = invisible on the sunlit side (fades out past the terminator), 0 = always visible
    // colours, bottom to top:
    colorLow = 0.4,1,0.192,1       // green  (bottom)
    colorMid = 0.4,0.2,0.9,1       // blue   (middle)
    colorHigh = 1,0.213,0.244,1    // red    (top)
    gainLow = 3                    // bottom-colour brightness
    gainMid = 0                    // middle-colour brightness (0 = no blue zone)
    gainHigh = 3                   // top-colour brightness
    // vertical colour layout, 0 = band bottom .. 1 = band top:
    // pure bottom colour up to greenTop, fades to the middle colour by blueBottom, pure middle until blueTop,
    // fades to the top colour by pinkBottom, pure top colour above (transitions are never narrower than +-6 %)
    greenTop = 0.504
    blueBottom = 0.5
    blueTop = 0.5
    pinkBottom = 1

    // ---- motion / storms ----
    baseAnimSpeed = 0.1549         // how fast the quiet aurora drifts and flickers
    stormAnimSpeed = 0.2507        // ...and at the peak of a storm (livelier)
    averageQuietDuration = 2700    // mean seconds between storms, in real time (45 min; the window's slider is in minutes). Random, never less than 40 % of this; the wait carries on across scene changes. A storm grows the oval from one arc to three, then fades

    // ---- light on the vessel (1.1.0) ----
    vesselLight = true             // the aurora lights your vessel: one, two or four lights from where the ribbons' light comes from, on the vessel's layers only (not terrain, water or clouds)
    vesselLightIntensity = 0.3     // their sum directly under a quiet, straight ribbon (dimmer from farther away; gone in daylight with the aurora)
    vesselLightCount = 4           // 1 = the mean direction, 2 = east / west halves of the sky, 4 = quarters; each light is a pass per part when per-pixel
    vesselLightPixel = true        // per-pixel lights; false = per-vertex (free, but shares Unity's four vertex-light slots per object with the craft's own lights, and can pulse)

    // ---- performance ----
    renderScale = 0.2452           // aurora buffer size vs screen: the GPU cost. 0.2452 = 17x fewer pixels than the screen, the temporal accumulation below rebuilding the detail; raise for crisper detail, lower for frames (0.2 is a third cheaper)
    temporalAccumulation = true    // 1.1.0: average the frames in a history buffer at twice the render resolution, reprojected as the camera moves (each frame samples a different sub-pixel and different depths): no grain, more detail, and the same picture from a lower render scale. false = every frame on its own
    temporalWeight = 0.9           // the history's weight per frame (0.9 = each new frame is a tenth): higher is smoother and slower to follow the animation

    // ---- misc ----
    mapView = true                 // the aurora around the scaled planet in the map view and the tracking station
    toggleKey = F8                 // opens the tuning window with the modifier key (Alt) held; any UnityEngine.KeyCode name

    // 1.1.0: one BODY node per other body (the values above are Kerbin's and the globals).
    // Only the keys you want to override are needed; the rest come from Config/<body>.cfg.
    BODY
    {
        name = Jool
        altBaseFraction = 0.0174
        altTopFraction = 0.0446
        latCenter = 0.8
        latWidth = 0.008
        foldStrength = 0.25
        foldScale = 3
        heightVariance = 1
        widthVariance = 0
        spikeThreshold = 0.3
        compressFactor = 0.3917
        colorLow = 0.124,0.464,1,1
        colorMid = 0.85,0.3,0.95,1
        colorHigh = 1,0.25,0.35,1
        gainLow = 2.5
        gainMid = 0.592
        greenTop = 0.3675
        blueBottom = 0.35
        blueTop = 0.6
        pinkBottom = 0.85
        brightness = 25.313
        exposure = 0.68
        baseActivity = 0.0983
        stormActivity = 0.2037
        averageQuietDuration = 2700
        ovalQuietSpread = 0.6
        ovalStormSpread = 1
        arc2Appears = 0
        arc3Appears = 0
        baseAnimSpeed = 0.1466
        stormAnimSpeed = 0.1974
        daylightFade = 0.9
        stepLength = 0.001
        nearStepScale = 1
        stepGrowth = 0.1
        stepFarMul = 3
