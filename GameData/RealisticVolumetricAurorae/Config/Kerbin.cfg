//
// Kerbin's aurora. The built-in defaults ARE Kerbin's tuned look, so this node only
// has to exist; any per-body key from settings.cfg could be added here to change the
// shipped preset (the in-game window's "def" buttons return to what is set here).
//
// A body gets an aurora when an RVA_AURORA node names it. To add one to another
// body, copy this file, change "body", and tune in the window (Alt+F8) — then
// "Copy + log <body>'s values" gives you the keys to paste below. Planet packs can
// ship their own RVA_AURORA nodes; ModuleManager can patch these.
// "enabled = false" switches a body's aurora off without deleting the node.

RVA_AURORA
{
	body = Kerbin
	enabled = true
}
