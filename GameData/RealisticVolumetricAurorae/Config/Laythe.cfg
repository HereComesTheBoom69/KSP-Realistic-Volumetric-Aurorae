// Laythe's aurora (1.1.0). A moon deep inside a gas giant's magnetosphere, like
// Ganymede: its aurora is driven by Jool's field rather than by the solar wind, so
// it is rarely quiet. An oxygen atmosphere gives it oxygen's colours — a single
// teal-green sheet with magenta above — so it reads as a cousin of Kerbin's, not of
// Jool's. The band is scaled to the 500 km moon and its 50 km atmosphere (~20–55 km
// up). One folded sheet around the rotation poles (no magnetic offset yet). Laythe
// passes through Jool's shadow for about an hour every orbit; the plugin drops the
// daylight fade while it does, so the aurora shows over the whole eclipsed moon.
// And its storms are Jool's storms: at the peak of one the oval spreads from its
// quiet latitude down to 12 deg, the arcs fanning out across the sky with their
// folds grown four times to match.
// Tune in the window (Alt+F8, Body: Laythe); the dev build's "Write Config/Laythe.cfg"
// button rewrites this file from the sliders. Only keys that differ from Kerbin's
// values need to be here; anything missing falls back to the built-in defaults.

RVA_AURORA
{
	body = Laythe
	enabled = true

	// geometry - fractions of Laythe's 500 km radius
	altBaseFraction       = 0.039    // band bottom ~20 km up
	altTopFraction        = 0.0719   // ~36 km tall
	latCenter             = 0.5825   // oval around 52 deg
	latWidth              = 0.005
	foldStrength          = 0.3
	foldScale             = 4
	bandSpacing           = 0        // the three arcs on one line ...
	bandIndependence      = 1        // ... each folding on its own: one sheet that crosses and merges with itself
	widthVariance         = 0
	edgeSharpness         = 0
	rayGain               = 5
	compressFactor        = 0.7875   // a gentler upper-band squeeze than Kerbin's

	// colours - teal-green sheet, magenta above, the red top switched off
	colorLow              = 0,1,0.771,1
	colorMid              = 1,0.402,1,1
	colorHigh             = 1,0.22,0.2,1
	gainLow               = 3
	gainMid               = 1.2159
	gainHigh              = 1.6729
	greenTop              = 0.1857
	blueBottom            = 0.791
	blueTop               = 0
	pinkBottom            = 0
	brightness            = 11
	exposure              = 0.68

	// activity - Jool's magnetosphere never lets it rest for long
	baseActivity          = 0.0997
	stormActivity         = 0.1994
	averageQuietDuration  = 2700
	ovalQuietSpread       = 0.45
	ovalStormSpread       = 1.6
	arc2Appears           = 0
	arc3Appears           = 0
	baseAnimSpeed         = 0.1251
	stormAnimSpeed        = 0.2451
	daylightFade          = 0.9

	// storms reach the equator: at peak the arcs run from the quiet oval's poleward arc
	// down to 12 deg, folds 4x
	stormToEquator        = true
	stormReach            = 0.1318
	stormFoldGain         = 4
	ovalStormWiden        = 0

	// sampling - a 36 km band wants its own steps: 2 km, shrinking to a quarter of that
	// under the band, growing to 2.2 km far out; the noise filtered to 3/4 of the step
	stepLength            = 0.0041
	nearStepScale         = 0.1243
	stepGrowth            = 0.1
	stepFarMul            = 1.0815
	stepFilter            = 0.75

	// EVE: top of the highest volumetric layer on Laythe, km
	cloudTopKm            = 16.1815
}
