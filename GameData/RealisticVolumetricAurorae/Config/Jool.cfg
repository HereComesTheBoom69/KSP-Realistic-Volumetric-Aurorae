// Jool's aurora (1.1.0): a gas giant's, tuned in orbit. Everything geometric is a
// fraction of the body's radius; on a 6000 km planet this band runs from ~100 km to
// ~370 km above the cloud deck. The ovals sit around the rotation poles (no magnetic
// offset yet), higher in latitude than Kerbin's, active most of the time, and in the
// blues, magentas and pinks of hydrogen emission instead of oxygen green.
// Best seen from orbit, and from Laythe's surface on Jool's limb.
// Tune in the window (Alt+F8, Body: Jool); the dev build's "Write Config/Jool.cfg"
// button rewrites this file from the sliders. Only keys that differ from Kerbin's
// values need to be here; anything missing falls back to the built-in defaults.

RVA_AURORA
{
	body = Jool
	enabled = true

	// geometry - fractions of Jool's 6000 km radius
	altBaseFraction       = 0.0174   // band bottom ~104 km above the cloud deck
	altTopFraction        = 0.0446   // ~270 km tall
	latCenter             = 0.8   // main oval around 72 deg - tight to the pole, as on a gas giant
	latWidth              = 0.008   // sheet half-width (fraction of 90 deg)
	foldStrength          = 0.25
	foldScale             = 3
	heightVariance        = 1   // full height variation
	widthVariance         = 0   // even sheet thickness along the band
	spikeThreshold        = 0.3
	compressFactor        = 0.3917   // strong upper-band squeeze

	// colours - hydrogen, not oxygen: blue base, magenta middle, red-pink top
	colorLow              = 0.124,0.464,1,1
	colorMid              = 0.85,0.3,0.95,1
	colorHigh             = 1,0.25,0.35,1
	gainLow               = 2.5
	gainMid               = 0.592
	greenTop              = 0.3675
	blueBottom            = 0.35
	blueTop               = 0.6
	pinkBottom            = 0.85
	brightness            = 25.313   // a gas giant's aurora is far brighter than Kerbin's
	exposure              = 0.68

	// activity - a gas giant's aurora is never quiet for long
	baseActivity          = 0.0983
	stormActivity         = 0.2037
	averageQuietDuration  = 2700
	ovalQuietSpread       = 0.6
	ovalStormSpread       = 1
	arc2Appears           = 0
	arc3Appears           = 0
	baseAnimSpeed         = 0.1466
	stormAnimSpeed        = 0.1974
	daylightFade          = 0.9

	// sampling - a 600 km band seen from Laythe, 27 000 km away, needs a far step small
	// next to its thickness (6-18 km); the step grows fast with distance to pay for it.
	// Fixed 6 km steps near the camera (no shrink), 18 km far out; the noise filtered to a
	// fifth of the step, since the temporal accumulation averages the aliasing that would
	// otherwise show, keeps the rays fine at these steps; the upsample fully smoothed
	stepLength            = 0.001
	nearStepScale         = 1
	stepGrowth            = 0.1
	stepFarMul            = 3
	stepFilter            = 0.2
	upsampleSmoothing     = 1

	// EVE: top of the highest volumetric layer on Jool, km (only matters inside the atmosphere)
	cloudTopKm            = 60
}
