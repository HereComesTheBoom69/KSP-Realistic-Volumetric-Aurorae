// Realistic Volumetric Aurorae (RVA): optional SPVE fix, independent of the
// aurora (needs ModuleManager; does nothing without SPVE).
//
// SPVE's Kerbin underwater "Ambience" layer ships with an empty lightning {}
// block and lightningFrequency = 10. With no lightningConfig named, EVE falls
// back to the first registered lightning config and fires storm lightning
// planet-wide at scene load. This neutralizes that layer's lightning.
// Delete this file if you'd rather keep SPVE's behavior.
@EVE_CLOUDS:NEEDS[SPVE]:AFTER[SPVE]
{
    @OBJECT:HAS[#name[Kerbin-ambience-underwater]]
    {
        @layerRaymarchedVolumeV5
        {
            !lightning {}
            @cloudTypes
            {
                @Item,*
                {
                    @lightningFrequency = 0
                }
            }
        }
    }
}
