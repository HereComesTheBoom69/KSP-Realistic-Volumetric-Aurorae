// SPVE paints its own aurora layers on Jool and on Laythe (a polar one and a global
// one). RVA draws both bodies' aurorae itself since 1.1.0, so with SPVE installed
// this removes SPVE's: every EVE cloud object on those two bodies whose name
// contains "urora". Needs ModuleManager; inert without SPVE. Delete this file to
// keep SPVE's layers as well.

@EVE_CLOUDS:NEEDS[SPVE]:AFTER[SPVE]
{
	!OBJECT:HAS[#body[Jool],#name[*urora*]],* {}
	!OBJECT:HAS[#body[Laythe],#name[*urora*]],* {}
}
