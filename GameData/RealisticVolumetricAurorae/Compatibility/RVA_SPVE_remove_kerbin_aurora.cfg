// Realistic Volumetric Aurorae (RVA) — SPVE compatibility (needs ModuleManager).
// Removes SPVE's own Kerbin aurora layers so RVA's volumetric aurora replaces
// them instead of drawing on top of them. Does nothing without SPVE.
//
// SPVE defines more than one aurora object on Kerbin (e.g. "Kerbin-Aurora"
// and the lower-latitude "Kerbin-Aurora-red"). The wildcard catches every
// OBJECT whose name starts with "Kerbin-Aurora"; the trailing ",*" tells
// ModuleManager to delete all matches, not just the first.
@EVE_CLOUDS:NEEDS[SPVE]:AFTER[SPVE]
{
    !OBJECT:HAS[#name[Kerbin-Aurora*]],* {}
}
